<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Torch & Trowel Growth Tracker</title>
    <style>
      :root {
        --ink: #303642;
        --muted: #656b75;
        --gold: #bd9430;
        --paper: #f6f3ec;
        --panel: #ffffff;
        --line: #ddd6c8;
        --ready: #fff4ca;
        --doing: #dcecf8;
        --review: #eadff6;
        --done: #dcebd8;
        --shadow: 0 14px 34px rgba(34, 38, 45, 0.12);
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
      }

      button, input, select, textarea { font: inherit; }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px clamp(18px, 4vw, 48px);
        background: rgba(246, 243, 236, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      h1 {
        margin: 0;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.45rem, 3vw, 2.4rem);
        line-height: 1.05;
      }

      .brand span,
      .status-line,
      .task-meta,
      .card-note,
      label {
        color: var(--muted);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--ink);
        border-radius: 7px;
        color: var(--ink);
        background: #fff;
        font-weight: 800;
        cursor: pointer;
      }

      .button.primary {
        color: #fff;
        background: var(--ink);
      }

      .button.ghost {
        border-color: var(--line);
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      main {
        padding: 26px clamp(18px, 4vw, 48px) 56px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(140px, 190px));
        gap: 12px;
        margin-bottom: 22px;
      }

      .input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        background: #fff;
        padding: 10px 12px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .metric,
      .panel,
      .task-card,
      dialog {
        background: var(--panel);
        border: 1px solid rgba(216, 210, 196, 0.8);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .metric {
        padding: 16px;
      }

      .metric strong {
        display: block;
        font-size: 2rem;
        line-height: 1;
      }

      .metric span {
        color: var(--muted);
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.6fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 14px;
        color: var(--ink);
        font-size: 1.08rem;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .task-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        box-shadow: none;
      }

      .task-card.ready { background: var(--ready); }
      .task-card.doing { background: var(--doing); }
      .task-card.needs-review { background: var(--review); }
      .task-card.done,
      .task-card.deployed,
      .task-card.measured { background: var(--done); }

      .task-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 850;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(48, 54, 66, 0.14);
        font-size: 0.78rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .task-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .lanes {
        display: grid;
        grid-template-columns: repeat(4, minmax(220px, 1fr));
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .lane {
        min-width: 220px;
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .lane h3 {
        margin: 0;
        padding: 10px 12px;
        border-radius: 7px;
        color: #fff;
        background: var(--ink);
        font-size: 0.94rem;
      }

      dialog {
        width: min(760px, calc(100vw - 28px));
        border: 0;
        padding: 0;
      }

      dialog::backdrop {
        background: rgba(24, 28, 34, 0.46);
      }

      .modal-body {
        display: grid;
        gap: 14px;
        padding: 22px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        max-width: min(420px, calc(100vw - 36px));
        padding: 12px 14px;
        border-radius: 7px;
        color: #fff;
        background: var(--ink);
        box-shadow: var(--shadow);
        transform: translateY(130%);
        transition: transform 180ms ease;
      }

      .toast.show { transform: translateY(0); }

      .empty {
        padding: 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.55);
      }

      @media (max-width: 980px) {
        .toolbar,
        .grid,
        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Growth Tracker</h1>
        <span>Torch & Trowel</span>
      </div>
      <div class="header-actions">
        <span class="status-line" id="statusLine">Loading...</span>
        <button class="button ghost" id="tokenButton" type="button">Access</button>
        <button class="button" id="recommendationButton" type="button">Add Recommendation</button>
        <button class="button primary" id="refreshButton" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Filters">
        <input class="input" id="searchInput" type="search" placeholder="Search tasks, notes, or next actions">
        <select id="statusFilter" aria-label="Status filter">
          <option value="">All statuses</option>
        </select>
        <select id="areaFilter" aria-label="Area filter">
          <option value="">All areas</option>
        </select>
        <select id="priorityFilter" aria-label="Priority filter">
          <option value="">All priorities</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </section>

      <section class="metrics" id="metrics"></section>

      <section class="grid">
        <div class="stack">
          <section class="panel">
            <h2>Start Here</h2>
            <div class="stack" id="nextList"></div>
          </section>
          <section class="panel">
            <h2>Blocked</h2>
            <div class="stack" id="blockedList"></div>
          </section>
          <section class="panel">
            <h2>Recommendation Inbox</h2>
            <div class="stack" id="recommendationList"></div>
          </section>
        </div>
        <section class="panel">
          <h2>Board</h2>
          <div class="lanes" id="lanes"></div>
        </section>
      </section>
    </main>

    <dialog id="taskDialog">
      <form class="modal-body" method="dialog">
        <input type="hidden" id="taskId">
        <h2 id="taskDialogTitle">Task</h2>
        <div class="form-grid">
          <label>Status
            <select id="taskStatus"></select>
          </label>
          <label>Priority
            <select id="taskPriority">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </label>
          <label class="wide">Next Action
            <textarea id="taskNextAction" rows="3"></textarea>
          </label>
          <label class="wide">Dependencies
            <textarea id="taskDependencies" rows="3"></textarea>
          </label>
          <label class="wide">Evidence / Notes
            <textarea id="taskNotes" rows="4"></textarea>
          </label>
        </div>
        <div class="header-actions">
          <button class="button ghost" value="cancel" type="submit">Cancel</button>
          <button class="button primary" id="saveTaskButton" value="default" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="recommendationDialog">
      <form class="modal-body" method="dialog">
        <h2>Add Recommendation</h2>
        <div class="form-grid">
          <label>Area
            <input class="input" id="recArea" value="Website">
          </label>
          <label>Priority
            <select id="recPriority">
              <option>High</option>
              <option selected>Medium</option>
              <option>Low</option>
            </select>
          </label>
          <label class="wide">Recommendation
            <textarea id="recText" rows="3"></textarea>
          </label>
          <label class="wide">Reason / Evidence
            <textarea id="recReason" rows="3"></textarea>
          </label>
          <label class="wide">Related URL
            <input class="input" id="recUrl">
          </label>
        </div>
        <div class="header-actions">
          <button class="button ghost" value="cancel" type="submit">Cancel</button>
          <button class="button primary" id="saveRecommendationButton" value="default" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script>
      const statuses = ["Inbox", "Backlog", "Ready", "Doing", "Needs Review", "Deployed", "Measured", "Done"];
      const visibleLanes = ["Ready", "Doing", "Needs Review", "Done"];
      const state = { tasks: [], recommendations: [], summary: null };
      const apiPath = "/api/growth-tracker";
      const tokenKey = "torchTrowelTrackerToken";

      const $ = (selector) => document.querySelector(selector);
      const token = () => localStorage.getItem(tokenKey) || "";

      const headers = () => ({
        "content-type": "application/json",
        ...(token() ? { authorization: `Bearer ${token()}` } : {})
      });

      const toast = (message) => {
        const node = $("#toast");
        node.textContent = message;
        node.classList.add("show");
        window.setTimeout(() => node.classList.remove("show"), 2600);
      };

      const request = async (url, options = {}) => {
        const response = await fetch(url, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error || "Request failed");
        return data;
      };

      const classForStatus = (status) => String(status || "").toLowerCase().replace(/\s+/g, "-");

      const taskMatchesFilters = (task) => {
        const query = $("#searchInput").value.trim().toLowerCase();
        const status = $("#statusFilter").value;
        const area = $("#areaFilter").value;
        const priority = $("#priorityFilter").value;
        const haystack = Object.values(task).join(" ").toLowerCase();
        return (!query || haystack.includes(query))
          && (!status || task.Status === status)
          && (!area || task.Area === area)
          && (!priority || task.Priority === priority);
      };

      const taskCard = (task) => {
        const article = document.createElement("article");
        article.className = `task-card ${classForStatus(task.Status)}`;
        article.innerHTML = `
          <div class="task-title">
            <span>${task.ID} - ${task.Task}</span>
            <span class="pill">${task.Priority}</span>
          </div>
          <div class="task-meta">${task.Area} / ${task.Status}</div>
          <div>${task["Next Action"] || "No next action set."}</div>
          ${task.Dependencies ? `<div class="card-note"><strong>Dependency:</strong> ${task.Dependencies}</div>` : ""}
          <div class="task-actions">
            <button class="button ghost" type="button" data-edit="${task.ID}">Edit</button>
            <button class="button ghost" type="button" data-start="${task.ID}">Start</button>
            <button class="button ghost" type="button" data-done="${task.ID}">Done</button>
          </div>
        `;
        return article;
      };

      const renderMetrics = () => {
        const summary = state.summary || {};
        const highOpen = state.tasks.filter((task) => task.Priority === "High" && !["Done", "Measured", "Deployed"].includes(task.Status)).length;
        const blocked = (summary.blocked || []).length;
        $("#metrics").innerHTML = `
          <div class="metric"><strong>${summary.openTasks || 0}</strong><span>Open</span></div>
          <div class="metric"><strong>${highOpen}</strong><span>High Priority</span></div>
          <div class="metric"><strong>${blocked}</strong><span>Blocked</span></div>
          <div class="metric"><strong>${summary.completedTasks || 0}</strong><span>Shipped / Done</span></div>
        `;
      };

      const renderList = (selector, tasks, emptyText) => {
        const node = $(selector);
        node.innerHTML = "";
        if (!tasks.length) {
          node.innerHTML = `<div class="empty">${emptyText}</div>`;
          return;
        }
        tasks.forEach((task) => node.appendChild(taskCard(task)));
      };

      const renderRecommendations = () => {
        const node = $("#recommendationList");
        const items = state.recommendations.slice(-5).reverse();
        node.innerHTML = "";
        if (!items.length) {
          node.innerHTML = '<div class="empty">No recommendations logged yet.</div>';
          return;
        }
        items.forEach((item) => {
          const article = document.createElement("article");
          article.className = "task-card";
          article.innerHTML = `
            <div class="task-title"><span>${item.Recommendation}</span><span class="pill">${item.Priority}</span></div>
            <div class="task-meta">${item.Area} / ${item.Decision}</div>
            <div class="card-note">${item["Reason / Evidence"] || ""}</div>
          `;
          node.appendChild(article);
        });
      };

      const renderBoard = () => {
        const lanes = $("#lanes");
        const filtered = state.tasks.filter(taskMatchesFilters);
        lanes.innerHTML = "";
        visibleLanes.forEach((status) => {
          const lane = document.createElement("div");
          lane.className = "lane";
          lane.innerHTML = `<h3>${status}</h3>`;
          const tasks = filtered.filter((task) => task.Status === status || (status === "Done" && ["Done", "Deployed", "Measured"].includes(task.Status)));
          if (!tasks.length) lane.innerHTML += '<div class="empty">Nothing here.</div>';
          tasks.forEach((task) => lane.appendChild(taskCard(task)));
          lanes.appendChild(lane);
        });
      };

      const renderFilters = () => {
        const statusFilter = $("#statusFilter");
        const areaFilter = $("#areaFilter");
        if (statusFilter.options.length === 1) statuses.forEach((status) => statusFilter.append(new Option(status, status)));
        const currentArea = areaFilter.value;
        const areas = [...new Set(state.tasks.map((task) => task.Area).filter(Boolean))].sort();
        areaFilter.innerHTML = '<option value="">All areas</option>';
        areas.forEach((area) => areaFilter.append(new Option(area, area)));
        areaFilter.value = currentArea;
      };

      const render = () => {
        renderFilters();
        renderMetrics();
        renderList("#nextList", (state.summary?.next || []).filter(taskMatchesFilters), "No ready high-priority tasks match the current filters.");
        renderList("#blockedList", (state.summary?.blocked || []).filter(taskMatchesFilters), "No blocked tasks match the current filters.");
        renderRecommendations();
        renderBoard();
      };

      const load = async () => {
        $("#statusLine").textContent = "Loading...";
        try {
          const data = await request(apiPath);
          state.tasks = data.tasks || [];
          state.recommendations = data.recommendations || [];
          state.summary = data.summary || {};
          $("#statusLine").textContent = `Synced ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
          render();
        } catch (error) {
          $("#statusLine").textContent = "Not connected";
          toast(error.message);
        }
      };

      const openTask = (id) => {
        const task = state.tasks.find((item) => item.ID === id);
        if (!task) return;
        $("#taskId").value = task.ID;
        $("#taskDialogTitle").textContent = `${task.ID} - ${task.Task}`;
        $("#taskStatus").innerHTML = "";
        statuses.forEach((status) => $("#taskStatus").append(new Option(status, status)));
        $("#taskStatus").value = task.Status;
        $("#taskPriority").value = task.Priority;
        $("#taskNextAction").value = task["Next Action"] || "";
        $("#taskDependencies").value = task.Dependencies || "";
        $("#taskNotes").value = task["Evidence / Notes"] || "";
        $("#taskDialog").showModal();
      };

      const saveTask = async () => {
        const button = $("#saveTaskButton");
        button.disabled = true;
        try {
          await request(`${apiPath}?action=update-task`, {
            method: "POST",
            body: JSON.stringify({
              id: $("#taskId").value,
              Status: $("#taskStatus").value,
              Priority: $("#taskPriority").value,
              "Next Action": $("#taskNextAction").value,
              Dependencies: $("#taskDependencies").value,
              "Evidence / Notes": $("#taskNotes").value
            })
          });
          $("#taskDialog").close();
          toast("Task updated in Google Sheets.");
          await load();
        } catch (error) {
          toast(error.message);
        } finally {
          button.disabled = false;
        }
      };

      const quickUpdate = async (id, Status) => {
        const task = state.tasks.find((item) => item.ID === id);
        if (!task) return;
        await request(`${apiPath}?action=update-task`, {
          method: "POST",
          body: JSON.stringify({ id, Status, "Evidence / Notes": task["Evidence / Notes"] })
        });
        toast(`${id} moved to ${Status}.`);
        await load();
      };

      const saveRecommendation = async () => {
        const button = $("#saveRecommendationButton");
        button.disabled = true;
        try {
          await request(`${apiPath}?action=add-recommendation`, {
            method: "POST",
            body: JSON.stringify({
              Area: $("#recArea").value,
              Priority: $("#recPriority").value,
              Recommendation: $("#recText").value,
              "Reason / Evidence": $("#recReason").value,
              "Related URL": $("#recUrl").value
            })
          });
          $("#recommendationDialog").close();
          $("#recText").value = "";
          $("#recReason").value = "";
          $("#recUrl").value = "";
          toast("Recommendation added to Google Sheets.");
          await load();
        } catch (error) {
          toast(error.message);
        } finally {
          button.disabled = false;
        }
      };

      document.addEventListener("click", async (event) => {
        const edit = event.target.closest("[data-edit]");
        const start = event.target.closest("[data-start]");
        const done = event.target.closest("[data-done]");
        if (edit) openTask(edit.dataset.edit);
        if (start) quickUpdate(start.dataset.start, "Doing").catch((error) => toast(error.message));
        if (done) quickUpdate(done.dataset.done, "Done").catch((error) => toast(error.message));
      });

      ["searchInput", "statusFilter", "areaFilter", "priorityFilter"].forEach((id) => {
        $(`#${id}`).addEventListener("input", render);
      });

      $("#refreshButton").addEventListener("click", load);
      $("#saveTaskButton").addEventListener("click", saveTask);
      $("#recommendationButton").addEventListener("click", () => $("#recommendationDialog").showModal());
      $("#saveRecommendationButton").addEventListener("click", saveRecommendation);
      $("#tokenButton").addEventListener("click", () => {
        const current = token();
        const next = prompt("Tracker access token", current);
        if (next === null) return;
        if (next.trim()) localStorage.setItem(tokenKey, next.trim());
        else localStorage.removeItem(tokenKey);
        load();
      });

      load();
    </script>
  </body>
</html>
